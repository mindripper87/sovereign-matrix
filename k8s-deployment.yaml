apiVersion: v1\nkind: Namespace\nmetadata:\n  name: sovereign-matrix\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: matrix-config\n  namespace: sovereign-matrix\ndata:\n  config.json: |\n    {\n      \"system_name\": \"Sovereign Matrix Control\",\n      \"version\": \"1.0.0\",\n      \"environment\": \"production\",\n      \"telemetry\": {\n        \"enabled\": true,\n        \"update_interval_seconds\": 15\n      }\n    }\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: sovereign-matrix-api\n  namespace: sovereign-matrix\n  labels:\n    app: sovereign-matrix\n    component: api\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: sovereign-matrix\n      component: api\n  template:\n    metadata:\n      labels:\n        app: sovereign-matrix\n        component: api\n    spec:\n      containers:\n      - name: api\n        image: mindripper87/sovereign-matrix:1.0.0\n        imagePullPolicy: IfNotPresent\n        ports:\n        - containerPort: 8000\n          protocol: TCP\n        env:\n        - name: PORT\n          value: \"8000\"\n        - name: ENVIRONMENT\n          value: \"production\"\n        resources:\n          requests:\n            memory: \"128Mi\"\n            cpu: \"100m\"\n          limits:\n            memory: \"512Mi\"\n            cpu: \"500m\"\n        livenessProbe:\n          httpGet:\n            path: /api/state\n            port: 8000\n          initialDelaySeconds: 10\n          periodSeconds: 30\n          timeoutSeconds: 5\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /api/state\n            port: 8000\n          initialDelaySeconds: 5\n          periodSeconds: 10\n          timeoutSeconds: 3\n          failureThreshold: 2\n        volumeMounts:\n        - name: config\n          mountPath: /app/config.json\n          subPath: config.json\n      volumes:\n      - name: config\n        configMap:\n          name: matrix-config\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: sovereign-matrix-service\n  namespace: sovereign-matrix\n  labels:\n    app: sovereign-matrix\nspec:\n  type: LoadBalancer\n  ports:\n  - port: 80\n    targetPort: 8000\n    protocol: TCP\n    name: http\n  selector:\n    app: sovereign-matrix\n    component: api\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: sovereign-matrix-hpa\n  namespace: sovereign-matrix\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: sovereign-matrix-api\n  minReplicas: 3\n  maxReplicas: 10\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: Resource\n    resource:\n      name: memory\n      target:\n        type: Utilization\n        averageUtilization: 80\n"